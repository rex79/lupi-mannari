name: prova

on:
  push:
  pull_request:

jobs:
  simulazione:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # 8 partite complete a soli bot: metà narratore automatico, metà umano.
      - run: npm run simula -- 8

  immagine-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .
