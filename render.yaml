# Blueprint Render: su https://dashboard.render.com → New → Blueprint, scegli questo repository.
# Render crea il servizio e aggiorna il gioco a ogni push su main.
# Ogni partita creata dalla pagina iniziale ha il proprio codice e la propria chiave del tavolo:
# non impostare CHIAVE_TAVOLO, altrimenti tutte le stanze condividerebbero la stessa chiave.
services:
  - type: web
    name: lupi-mannari
    runtime: node
    plan: free            # gratis: si addormenta dopo ~15 min senza visite (il primo accesso impiega ~1 min)
    region: frankfurt
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /salute
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MAX_STANZE
        value: "20"
      - key: MIN_GIOCATORI
        value: "4"
